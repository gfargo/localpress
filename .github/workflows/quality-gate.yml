name: Quality gate

# The background-removal quality suite is too slow and too bandwidth-hungry
# (~620 MB of ONNX models) to run on every PR, but it was previously not wired
# up at all — it only ran if a human remembered to set an env var, which is why
# a regression in the default model went unnoticed (localpress#336).
#
# Nightly gives it a real, unattended cadence; the pre-release run makes it a
# gate on shipping. It can also be kicked off by hand from the Actions tab.

on:
  schedule:
    # 07:00 UTC daily — after the usual merge window, before the day starts.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated models to test (blank = all five)'
        required: false
        type: string
  workflow_call:
    inputs:
      models:
        description: 'Comma-separated models to test (blank = all five)'
        required: false
        type: string

jobs:
  remove-bg-quality:
    name: Background-removal quality
    runs-on: ubuntu-latest
    # Model downloads dominate a cold run; inference on CPU is the rest.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Models are content-addressed by URL + checksum in the registry, so a
      # cache keyed on the registry file invalidates exactly when a model
      # changes and never goes stale silently.
      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: ~/.config/localpress/models
          key: onnx-models-${{ hashFiles('src/engine/rembg/models.ts') }}
          restore-keys: onnx-models-

      - name: Run background-removal quality gate
        env:
          LOCALPRESS_QUALITY_MODELS: ${{ inputs.models }}
        run: bun run test:quality
